[package]
name = "syncdaq_web"
version = "0.1.0"
edition = "2021"
description = "syncdaq control dashboard + short-segment capture/FFT spectrum"

[dependencies]
syncdaq = { path = "../syncdaq" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = { version = "0.3", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rustfft = "6"
num-complex = "0.4"
num = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
askama = "0.14"

[[bin]]
name = "syncdaq_web"
path = "src/main.rs"
